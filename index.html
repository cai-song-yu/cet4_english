<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="英语阅读课程 · 90 篇递进式训练：阅读 / 写作 / 口语。含核心词汇、高频搭配、写作表达、长难句解析、阅读理解与输出任务，并内置划词查词、全文朗读、生词本与学习进度。" />
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#191714" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>英语阅读课程 · 90 篇递进训练</title>
<link rel="stylesheet" href="assets/css/reader.css?v=5.6" />
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="navToggle" type="button" title="收起/展开目录">☰ 目录</button>
  <span class="t-title" id="topTitle" role="link" tabindex="0" title="回到课程总览">英语阅读课程</span>
  <div class="tools">
    <span class="fs-label">正文字号</span>
    <button class="icon-btn" id="fontDown" type="button" title="缩小字号（−）">A−</button>
    <button class="icon-btn" id="fontUp" type="button" title="放大字号（+）">A+</button>
    <span class="sep"></span>
    <button class="icon-btn tts-btn" id="ttsPlay" type="button" title="朗读正文（浏览器语音合成）">▶<span class="tts-lbl"> 朗读</span></button>
    <button class="icon-btn tts-btn" id="ttsPause" type="button" title="暂停 / 继续" disabled>⏸<span class="tts-lbl"> 暂停</span></button>
    <button class="icon-btn tts-btn" id="ttsStop" type="button" title="停止朗读" disabled>⏹<span class="tts-lbl"> 停止</span></button>
    <button class="icon-btn" id="ttsRate" type="button" title="朗读语速（点击切换）" disabled>1×</button>
    <span class="sep"></span>
    <button class="icon-btn" id="themeBtn" type="button" title="切换深色/浅色模式（T）">🌙</button>
    <button class="icon-btn" id="helpBtn" type="button" title="快捷键与使用帮助（?）">?</button>
    <button class="icon-btn" id="nextBtn" type="button" title="下一篇（→ 方向键）">下一篇 →</button>
  </div>
</header>

<div class="scrim" id="scrim"></div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>English Reading</h1>
      <p>90 篇递进式训练 · 阅读 / 写作 / 口语<br />目标：CET-4 520 分语言能力</p>
    </div>
    <nav id="quick"></nav>
    <div class="stage-label" id="tocLabel">本文目录</div>
    <nav id="toc"></nav>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="navFoot"></div>
  </aside>

  <main class="main">
    <div class="main-inner">
      <div class="content" id="view"></div>
    </div>
  </main>
</div>

<button class="to-top" id="toTop" type="button" title="回到顶部">↑</button>

<script src="assets/js/articles.js?v=5.6"></script>
<script src="assets/audio/manifest.js?v=5.6"></script>
<script src="assets/audio/words/manifest.js?v=5.6"></script>
<script src="assets/js/app.js?v=5.6"></script>
</body>
</html>
